[package]
name = "cryptex"
authors = ["Michael Lodder <redmike7@gmail.com>"]
categories = []
description = """
Cryptex uses system keyrings to store and retrieve secrets
or a local file
"""
documentation = "https://docs.rs/cryptex/"
edition = "2024"
homepage = "https://github.com/mikelodder7/cryptex"
keywords = ["secrets", "vault", "keyring"]
license = "MIT/Apache-2.0"
repository = "https://github.com/mikelodder7/cryptex"
readme = "README.md"
version = "2.4.0"

# `all-features` is not used: the browser-only features (web-storage,
# indexeddb, opfs, js) are rejected on non-wasm targets on purpose.
[package.metadata.docs.rs]
no-default-features = true
features = [
    "serde",
    "file",
    "encrypted-vfs",
    "memory",
    "turso",
    "turso-encrypted-io",
    "yubihsm-usb",
    "yubihsm-http",
]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-udeps.ignore]
normal = ["rpassword", "whoami"]

[lib]
crate-type = ["staticlib", "rlib", "cdylib"]

[[bin]]
name = "cryptex"

[features]
default = ["linux-secret-service", "macos-keychain", "windows-credentials"]
file = ["dep:argon2", "dep:dirs", "dep:rusqlite", "rusqlite/bundled-sqlcipher-vendored-openssl"]
memory = ["dep:argon2", "dep:chacha20poly1305", "dep:aes-gcm", "dep:getrandom"]
web-storage = ["memory", "dep:web-sys", "dep:wasm-bindgen"]
indexeddb = ["dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
opfs = ["dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
js = [
    "memory",
    "indexeddb",
    "dep:web-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
]
encrypted-vfs = ["dep:argon2", "dep:dirs", "dep:rusqlite", "rusqlite/bundled", "dep:chacha20poly1305", "dep:aes-gcm", "dep:sqlite-plugin", "dep:getrandom"]
turso = ["dep:argon2", "dep:dirs", "dep:turso", "dep:bindgen"]
turso-encrypted-io = ["dep:argon2", "dep:dirs", "dep:turso", "dep:bindgen", "dep:chacha20poly1305", "dep:aes-gcm", "dep:getrandom"]
linux-secret-service = ["secret-service", "uzers"]
macos-keychain = ["security-framework", "security-framework-sys", "core-foundation", "core-foundation-sys", "uzers"]
windows-credentials = ["windows"]
serde = ["dep:serde", "postcard"]
yubihsm-usb = ["dep:yubihsm", "yubihsm/usb", "yubihsm/passwords", "dep:aes-gcm", "dep:sha2", "dep:getrandom", "dep:dirs"]
yubihsm-http = ["dep:yubihsm", "yubihsm/http", "yubihsm/passwords", "dep:aes-gcm", "dep:sha2", "dep:getrandom", "dep:dirs"]

[dependencies]
aes-gcm = { version = "0.11", optional = true }
argon2 = { version = "0.5", optional = true }
chacha20poly1305 = { version = "0.11", optional = true }
clap = "4.6.1"
colored = "3.0"
dirs = { version = "6.0", optional = true }
getrandom = { version = "0.4.3", optional = true }
hex = "0.4"
postcard = { version = "1", default-features = false, features = ["use-std"], optional = true }
rusqlite = { version = "0.40.1", default-features = false, optional = true }
serde = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
sqlite-plugin = { version = "0.10", optional = true }
subtle = "2"
# Pre-release pinned exactly: page encryption and custom IO are only exposed here.
turso = { version = "=0.9.0-pre.1", default-features = false, optional = true }
whoami = "2.1.2"
yubihsm = { version = "0.42", default-features = false, optional = true }
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rpassword = "7.5.4"

# Criterion pulls in Rayon, which does not build for wasm.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2.130", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Storage",
    "Performance",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "StorageManager",
    "LockManager",
    "LockManagerSnapshot",
    "Lock",
    "IdbFactory",
    "IdbDatabase",
    "IdbOpenDbRequest",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbRequest",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemSyncAccessHandle",
    "FileSystemReadWriteOptions",
] }

# Turso's native page encryption on wasm must use its pure-Rust ciphers;
# the native `aegis` build links C.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.turso]
version = "=0.9.0-pre.1"
default-features = false
features = ["pure-rust-crypto"]
optional = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "cipher_bench"
harness = false
required-features = ["encrypted-vfs"]

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
uzers = { version = "0.12", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }
security-framework-sys = { version = "2.12", optional = true }
core-foundation = { version = "0.10", optional = true }
core-foundation-sys = { version = "0.8.7", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
], optional = true }

[build-dependencies]
# Never compiled (no build.rs); only aligns feature resolution. turso_sdk_kit's
# bindgen 0.69 enables clang-sys `runtime`, which breaks sqlite-plugin's bindgen
# 0.72 unless it also loads libclang at runtime. Drop once upstream aligns.
bindgen = { version = "0.72", default-features = false, features = ["runtime"], optional = true }
