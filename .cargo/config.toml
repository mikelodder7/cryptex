[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8"]

# getrandom 0.3 (through turso_core) needs this cfg to pick its Web Crypto
# backend on wasm32-unknown-unknown. Only a backend selection, never a URL.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="wasm_js"']

[target.wasm32-wasip1]
runner = "wasmtime"
